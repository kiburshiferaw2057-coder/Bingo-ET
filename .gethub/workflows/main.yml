name: Build BINGO ET Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare Capacitor project and web assets
        run: |
          mkdir -p android-twa-capacitor/www
          for f in index.html styles.css app.js manifest.json sw.js; do
            if [ -f "$f" ]; then
              cp "$f" android-twa-capacitor/www/
            fi
          done
          if [ ! -f "android-twa-capacitor/www/index.html" ]; then
            echo "<h1>BINGO ET</h1>" > android-twa-capacitor/www/index.html
          fi
          cd android-twa-capacitor
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          if [ ! -f "capacitor.config.json" ]; then
            cat << 'EOF' > capacitor.config.json
          {
            "appId": "et.bingo.app",
            "appName": "BINGO ET",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          fi

      - name: Build Android APK
        run: |
          cd android-twa-capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bingo-et-debug-apk
          path: android-twa-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
