# GitHub Actions workflow to build BINGO ET Android APK
name: Build BINGO ET Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          cmdline-tools-version: "16.0"

      - name: Stage web assets into Capacitor www
        run: |
          mkdir -p android-twa-capacitor/www
          cp index.html styles.css app.js manifest.json sw.js android-twa-capacitor/www/

      - name: Build Android APK
        run: |
          cd android-twa-capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bingo-et-debug-apk
          path: android-twa-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
